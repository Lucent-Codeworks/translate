services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: translate
      POSTGRES_PASSWORD: translate
      POSTGRES_DB: translate
    ports:
      - "5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
